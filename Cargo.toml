[package]
name = "parley"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "parley"
path = "src/main.rs"

[dependencies]
# HTML sanitizer — strip unsafe tags/attrs from typst output and message bodies
ammonia = "4.1"

# Byte buffer utilities
bytes = "1.11.1"

# Date and time types
chrono = "0.4.42"

# CLI argument parsing
clap = { version = "4.5", features = ["derive", "wrap_help"] }

# Colored terminal output
colored = "3.0.0"

# Platform-specific user directory paths (config, home, etc.)
dirs = "6.0.0"

# HTTP framework — OpenAPI-first, matches existing projects
dropshot = { git = "https://github.com/clintjedwards/dropshot.git" }

# Config loading: merge defaults + file + env vars
figment = { version = "0.10.19", features = ["env", "toml"] }

# Async stream utilities (used with sqlx)
futures = "0.3"

# Hex encode/decode for token hashing
hex = "0.4"

# HMAC-SHA256 for GitHub webhook signature verification
hmac = "0.12"

# Terminal output formatting
polyfmt = { git = "https://github.com/clintjedwards/polyfmt-rs.git", tag = "v0.1.0" }

# Markdown → HTML for discussion message bodies
pulldown-cmark = "0.13"

# TUI framework
ratatui = "0.29"

# Error handling
rootcause = "0.12.1"

# OpenAPI schema generation (required by dropshot endpoints)
schemars = "0.8"

# HTML parsing + manipulation for data-pindex injection into typst output
scraper = "0.25"

# Semantic versioning
semver = "1.0.27"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# SHA256 for hashing bearer tokens before DB storage
sha2 = "0.10.9"

# SQLite with async support; split read/write pools
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite"] }

# Enum utilities and display
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.27"

# Error derive macros
thiserror = "2.0"

# Async runtime
tokio = { version = "1.48", features = ["full"] }

# WebSocket client (TUI → server real-time updates)
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }

# TOML parsing for RFD metadata.toml files in the git repo
toml = "0.9"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# UUIDv7 (time-ordered, used for all primary keys)
uuid = { version = "1.22", features = ["v7"] }

# Find binary executables in PATH
which = "8.0.0"

tungstenite = "0.26"

async-trait = "0.1"

hyper = { version = "1.6", features = ["server", "full"] }
rand = "0.10.1"


[dev-dependencies]
pretty_assertions = "1.4.1"
